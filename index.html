<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>AI 泡沫检测仪</title>
<meta name="description" content="AI 泡沫监测面板：环境 / 结构 / 引爆三层，20 条红线。数据截至 2026-08-26。">

<style>
/* ==== 北欧黑白风 token（nordic-bw v1.0）—— 与 ourword-site 基准一致 ==== */
:root{
  color-scheme:light only;
  --ink:#0a0a0a; --ink-70:#404040; --ink-50:#666666; --ink-30:#b3b3b3;
  --hairline:#e5e5e5; --surface:#ffffff; --bg:#fafafa; --tint:#f0f0f0;
  --cta-fill:#0a0a0a; --cta-text:#ffffff;
  --nb-up:#3a6b4a; --nb-down:#a13a2e; --nb-warn:#713f00;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --fs-micro:10px; --fs-caption:11px; --fs-body:13px; --fs-strong:14px; --fs-heading:16px; --fs-display:20px;
  --h-sm:28px; --h-md:36px; --h-lg:46px;
  --r-block:8px; --r-card:16px;
  --shadow-card:0 1px 2px rgba(10,10,10,.03),0 6px 20px rgba(10,10,10,.06);
  --shadow-pop:0 2px 6px rgba(10,10,10,.05),0 12px 32px rgba(10,10,10,.08);
  --focus:0 0 0 2px var(--ink);
  --font:'Inter','Noto Sans CJK SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
}

:root{
  --line:var(--hairline);
  --line2:var(--hairline);
  --ink:#0a0a0a;
  --ink2:var(--ink-70);
  --soft:var(--ink-50);
  --red:var(--nb-down);
  --amb:var(--nb-warn);
  --grn:var(--nb-up);
  --slate:var(--ink-70);
  --disp:var(--font);
  --body:var(--font);
  --mono:'JetBrains Mono','DejaVu Sans Mono',monospace;
}


html,body{ background:var(--bg) !important; color:var(--ink) !important; }
@media (prefers-color-scheme: dark){
  
  html,body{ background:var(--bg) !important; color:var(--ink) !important; }
  .nav,.cell,table,th,td,.box,.tier,.rl,.log,.hero{background:var(--bg) !important}
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);font-size:var(--fs-heading);line-height:1.7;-webkit-font-smoothing:antialiased;padding-bottom:56px}
.wrap{max-width:820px;margin:0 auto;padding:0 var(--sp-5)}

.nav{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.navin{max-width:820px;margin:0 auto;padding:0 var(--sp-5);display:flex;align-items:center;gap:var(--sp-1);height:44px;overflow-x:auto;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin b{font-family:var(--font);font-weight:700;font-size:var(--fs-caption);letter-spacing:.1em;margin-right:var(--sp-3);white-space:nowrap;flex:none}
.navin a{font-family:var(--font);font-size:var(--fs-caption);color:var(--soft);text-decoration:none;padding:var(--sp-1) var(--sp-2);white-space:nowrap;border-radius:var(--r-block)}
.navin a:hover{color:var(--ink);background:var(--line2)}

h1{font-family:var(--font);font-weight:700;font-size:34px;letter-spacing:.01em;margin:var(--sp-6) 0 var(--sp-1)}
h2{font-family:var(--font);font-weight:700;font-size:var(--fs-body);letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft);margin:52px 0 var(--sp-3);padding-bottom:var(--sp-2);border-bottom:1px solid var(--line)}
h3{font-family:var(--font);font-weight:600;font-size:var(--fs-heading);margin:0}
.sub{color:var(--soft);font-size:var(--fs-body);font-family:var(--font)}
p{margin:var(--sp-3) 0}
.sm{font-size:var(--fs-body);color:var(--soft)}
.mono{font-family:var(--font)}
b.hl{background:var(--tint);padding:0 var(--sp-1)}

/* 记分板 */
.hero{border:1px solid var(--line);border-radius:var(--r-block);padding:var(--sp-4) var(--sp-5);margin:var(--sp-5) 0}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--sp-1);background:var(--line);border:1px solid var(--line);border-radius:var(--r-block);overflow:hidden}
.cell{background:var(--surface);padding:var(--sp-3) var(--sp-4)}
.cell .k{font-family:var(--font);font-weight:700;font-size:var(--fs-caption);letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.cell .g{font-size:var(--fs-caption);color:var(--soft);margin-top:var(--sp-1)}
.cell .v{font-family:var(--font);font-size:var(--fs-display);margin-top:var(--sp-1);letter-spacing:-.02em}
.cell.a .v{color:var(--red)} .cell.b .v{color:var(--amb)} .cell.c .v{color:var(--slate)} .cell.d .v{color:var(--grn)}

#dotBoard{display:flex;flex-wrap:wrap;gap:var(--sp-1);margin:var(--sp-4) 0 var(--sp-2)}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink-30)}
.dot.on{background:var(--ink);border-color:var(--ink)}
.dot.a{background:var(--red);border-color:var(--red)}

.callout{font-family:var(--font);font-weight:600;font-size:var(--fs-display);line-height:1.45;margin:var(--sp-4) 0 var(--sp-2)}

/* 层 */
.tier{border:1px solid var(--line);border-radius:var(--r-block);margin:var(--sp-4) 0;overflow:hidden}
.tier > header{padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap}
.tier > header .gate{font-family:var(--font);font-size:var(--fs-caption);color:var(--soft);margin-left:auto}
.tier.a > header{border-left:3px solid var(--red)}
.tier.b > header{border-left:3px solid var(--amb)}
.tier.c > header{border-left:3px solid var(--slate)}
.tier .lead{padding:var(--sp-3) var(--sp-4);background:var(--bg);border-bottom:1px solid var(--line2);font-size:var(--fs-body);color:var(--ink2)}
.ti{padding:var(--sp-4) var(--sp-4);border-bottom:1px solid var(--line2)}
.ti:last-child{border-bottom:none}
.ti h4{font-family:var(--font);font-weight:600;font-size:var(--fs-heading);margin:0 0 var(--sp-1);display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap}
.ti p{margin:var(--sp-1) 0 0;font-size:var(--fs-strong);color:var(--ink2)}
.ti .src{font-family:var(--font);font-size:var(--fs-caption);color:var(--soft);margin-top:var(--sp-1)}
.ti .fig{font-family:var(--font);font-size:var(--fs-body);color:var(--ink);margin-top:var(--sp-1)}
.ti .fig i{font-style:normal;color:var(--soft)}

.st{font-family:var(--font);font-weight:600;font-size:var(--fs-micro);letter-spacing:.08em;text-transform:uppercase;
  padding:var(--sp-1) var(--sp-2);border-radius:var(--r-block);border:1px solid;white-space:nowrap}
.st[data-s="1"]{color:var(--red);border-color:var(--red);background:var(--tint)}
.st[data-s="0"]{color:var(--grn);border-color:var(--grn);background:var(--tint)}
.st[data-s="d"]{color:var(--amb);border-color:var(--amb);background:var(--tint)}
.st[data-s="?"]{color:var(--soft);border-color:var(--ink-30)}

table{width:100%;border-collapse:collapse;margin:var(--sp-3) 0;font-size:var(--fs-body)}
th,td{text-align:left;padding:var(--sp-2) var(--sp-2);border-bottom:1px solid var(--line2);vertical-align:top}
th{font-family:var(--font);font-size:var(--fs-caption);letter-spacing:.1em;text-transform:uppercase;color:var(--soft);border-bottom:1px solid var(--line)}
td.n{font-family:var(--font);white-space:nowrap}
tr.tr2 td:first-child{font-family:var(--font);color:var(--red)}
tr.past{opacity:.55}

.box{border:1px solid var(--line);border-left:3px solid var(--amb);border-radius:var(--r-block);padding:var(--sp-4) var(--sp-4);margin:var(--sp-4) 0;background:var(--surface)}
.box h4{font-family:var(--font);font-weight:700;font-size:var(--fs-caption);letter-spacing:.1em;text-transform:uppercase;color:var(--amb);margin:0 0 var(--sp-2)}
.box.red{border-left-color:var(--red);background:var(--surface)}
.box.red h4{color:var(--red)}
ul,ol{margin:var(--sp-2) 0;padding-left:var(--sp-4)}
li{margin:var(--sp-1) 0;font-size:var(--fs-strong)}

.log{border-top:1px solid var(--line);padding-top:var(--sp-3);margin-top:var(--sp-2)}
.log .row{display:grid;grid-template-columns:64px 1fr;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--line2);font-size:var(--fs-strong)}
.log .row .d{font-family:var(--font);font-size:var(--fs-caption);color:var(--soft)}
footer{margin-top:56px;padding-top:var(--sp-4);border-top:1px solid var(--line);font-size:var(--fs-body);color:var(--soft)}
footer p{margin:var(--sp-2) 0}

/* ==== 北欧版式二次改造（追加覆盖，不改动上方任何既有规则）==== */

body{background:var(--bg)}
.wrap{max-width:820px}
h1{font-size:34px;letter-spacing:-.02em;line-height:1.15;margin:var(--sp-6) 0 var(--sp-3)}
.sub{font-size:var(--fs-heading);color:var(--ink-70);max-width:34em}
h2{font-size:var(--fs-display);letter-spacing:-.01em;margin:var(--sp-6) 0 var(--sp-4)}
/* 内容块变白卡：阴影分层、去描边（描边与阴影二选一） */
.hero,.box,.tier,.rl,.log,.cells{background:var(--surface);border:0;border-radius:var(--r-card);
  box-shadow:var(--shadow-card);padding:var(--sp-5)}
.cell{background:var(--tint);border:0;border-radius:var(--r-block);padding:var(--sp-4)}
.cell .k{font-size:var(--fs-caption);color:var(--ink-50);letter-spacing:.07em}
.cell .v{font-size:var(--fs-display);font-variant-numeric:tabular-nums;white-space:nowrap}
table{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-card);
  border-collapse:separate;border-spacing:0;overflow:hidden}
th{font-size:var(--fs-caption);color:var(--ink-50);letter-spacing:.07em;text-transform:uppercase;
  background:var(--tint);border:0;padding:var(--sp-3) var(--sp-4);white-space:nowrap}
td{border:0;border-top:1px solid var(--hairline);padding:var(--sp-3) var(--sp-4);
  font-variant-numeric:tabular-nums}
/* 导航：黑色实心药丸只留给当前项 */
.nav{background:var(--bg);border-bottom:1px solid var(--hairline)}
.nav a{height:var(--h-sm);display:inline-flex;align-items:center;padding:0 var(--sp-3);
  border-radius:14px;background:var(--tint);color:var(--ink-70);text-decoration:none;
  font-size:var(--fs-body);transition:background .18s ease-out,color .18s ease-out}
.nav a:hover{background:var(--hairline)}
.nav a.on,.nav a:active{background:var(--cta-fill);color:var(--cta-text)}
.navin{gap:var(--sp-2);flex-wrap:wrap}

/* 手机端：宽表格改为自身横滑，避免撑破整页视口（不改 DOM 结构） */
@media(max-width:640px){
  .wrap{overflow-x:hidden}
  table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;
        box-shadow:var(--shadow-card);border-radius:var(--r-card)}
  table thead,table tbody{display:table;width:max-content;min-width:100%}
  th,td{white-space:nowrap}
  .nav a{min-height:24px}
}
a{overflow-wrap:anywhere}
